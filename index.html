<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <title>⚓ Морской Бой</title>
  <style>
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    
    body {
      background: #0a1628; font-family: 'Courier New', monospace; color: #00ff41;
      min-height: 100vh; overflow-y: auto; padding-bottom: 20px;
    }

    /* CRT Эффект монитора */
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,65,0.03) 0px, rgba(0,255,65,0.03) 1px, transparent 1px, transparent 3px);
      pointer-events: none; z-index: 1000;
    }

    .container { max-width: 440px; margin: 0 auto; padding: 8px; position: relative; z-index: 1; }
    .header { text-align: center; padding: 6px 0; border-bottom: 2px solid #00ff41; margin-bottom: 10px; }
    .header h1 { font-size: 1.3em; text-shadow: 0 0 10px #00ff41; letter-spacing: 2px; }

    .info-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .info-box { background: rgba(0, 255, 65, 0.05); border: 1px solid #00ff41; padding: 6px 2px; text-align: center; border-radius: 4px; }
    .info-box .label { font-size: 0.6em; color: #00aa2a; }
    .info-box .value { font-size: 1.3em; font-weight: bold; }

    /* ─── РАДАРНЫЙ ЭКРАН ─── */
    .radar-screen {
      background: #051018;
      border: 2px solid #00ff41;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
      margin-bottom: 10px;
      touch-action: manipulation;
    }

    .board {
      display: grid;
      grid-template-columns: 22px repeat(10, 1fr);
      grid-template-rows: 22px repeat(10, 1fr);
      gap: 2px;
      width: 100%;
    }

    .board-label { 
      display: flex; align-items: center; justify-content: center; 
      font-size: 0.65em; color: #00ff41; font-weight: bold; 
    }

    .cell {
      aspect-ratio: 1;
      background: rgba(0, 80, 160, 0.4);
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 3px;
      cursor: pointer; position: relative;
    }

    .cell:active { background: rgba(0, 255, 65, 0.5); }

    .cell.miss::after { 
      content: '•'; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); color: #00aa2a; font-size: 1.2em; 
    }
    
    .cell.hit { background: rgba(255, 60, 0, 0.5); border-color: #ff3c00; }
    .cell.hit::after { 
      content: '🔥'; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); font-size: 0.85em; 
    }

    .cell.sunk { background: rgba(255, 0, 0, 0.6); border-color: #ff0000; }
    .cell.sunk::after { 
      content: '💀'; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); font-size: 0.85em; 
    }

    .cell.revealed { background: rgba(100, 100, 100, 0.3); }

    .message-bar { 
      background: rgba(0, 255, 65, 0.05); border: 1px solid #00ff41; 
      padding: 8px; text-align: center; margin-bottom: 10px; 
      font-size: 0.85em; min-height: 36px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }

    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn { 
      flex: 1; padding: 12px; background: transparent; 
      border: 2px solid #00ff41; color: #00ff41; 
      font-family: 'Courier New', monospace; font-size: 0.85em; 
      font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; 
    }
    .btn:active { background: #00ff41; color: #0a1628; }
    .btn.accent { border-color: #ffaa00; color: #ffaa00; }

    .fleet-status { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .ship-indicator { display: flex; gap: 1px; }
    .ship-segment { width: 7px; height: 7px; background: #00ff41; border-radius: 1px; }
    .ship-indicator.destroyed { opacity: 0.2; }

    .start-screen { text-align: center; padding: 30px 10px; }
    .start-screen input { 
      background: transparent; border: none; border-bottom: 2px solid #00ff41; 
      color: #00ff41; font-family: 'Courier New', monospace; font-size: 1.1em; 
      padding: 8px; text-align: center; width: 85%; outline: none; margin-bottom: 20px; 
      -webkit-user-select: auto; user-select: auto; 
    }

    /* Таблица рекордов */
    .scores-table {
      width: 100%; border-collapse: collapse; font-size: 0.75em; margin-top: 10px;
      background: rgba(0, 255, 65, 0.05); border: 1px solid #00ff41;
    }
    .scores-table th { border-bottom: 1px solid #00ff41; padding: 6px; color: #00aa2a; text-align: left; }
    .scores-table td { padding: 6px; border-bottom: 1px solid rgba(0, 255, 65, 0.1); text-align: left; }
    .scores-table tr:first-child td { color: #ffaa00; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Стартовый экран -->
    <div id="startScreen" class="start-screen">
      <div class="header"><h1>⚓ МОРСКОЙ БОЙ</h1></div>
      <input type="text" id="playerNameInput" placeholder="ИМЯ КАПИТАНА" maxlength="15">
      <button class="btn accent" onclick="startNewGame()">🚀 В БОЙ!</button>
      <button class="btn" style="margin-top:12px" onclick="showScores()">🏆 РЕКОРДЫ</button>
      <div id="scoresContainer"></div>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" style="display: none;">
      <div class="header"><h1>⚓ МОРСКОЙ БОЙ</h1></div>
      
      <div class="info-panel">
        <div class="info-box"><div class="label">ОЧКИ</div><div class="value" id="scoreDisplay">0</div></div>
        <div class="info-box"><div class="label">ВЫСТРЕЛЫ</div><div class="value" id="shotsDisplay">40</div></div>
        <div class="info-box"><div class="label">ФЛОТ</div><div class="value" id="shipsDisplay">10</div></div>
      </div>

      <div class="fleet-status" id="fleetStatus"></div>
      <div class="message-bar" id="messageBar">Жми на квадрат для выстрела! 🎯</div>
      
      <div class="radar-screen">
        <div class="board" id="gameBoard"></div>
      </div>

      <div class="controls">
        <button class="btn" onclick="returnToMenu()">◀ МЕНЮ</button>
        <button class="btn accent" onclick="startNewGame()">🔄 ЗАНОВО</button>
      </div>
    </div>
  </div>

  <script>
    // ─── АУДИО И МУЗЫКАЛЬНЫЙ ДВИЖОК ───
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      
      play(type) {
        if (!this.ctx) return;

        // 🚀 СТАРТ ИГРЫ (Сигнал боевой тревоги / сонар)
        if (type === 'start') {
          const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              try {
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination);
                o.type = 'triangle'; o.frequency.value = freq;
                g.gain.setValueAtTime(0.18, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                o.start(); o.stop(this.ctx.currentTime + 0.15);
              } catch(e){}
            }, idx * 80);
          });
        }
        else if (type === 'miss') {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.frequency.value = 150; gain.gain.value = 0.1; 
          osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'hit') {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.frequency.value = 500; gain.gain.value = 0.2; 
          osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        } else if (type === 'sunk') {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.frequency.value = 250; gain.gain.value = 0.3; 
          osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        } 
        // 🎺 ПОБЕДНАЯ МЕЛОДИЯ (8-bit Fanfare)
        else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              try {
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination);
                o.type = 'square'; o.frequency.value = freq;
                g.gain.setValueAtTime(0.15, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                o.start(); o.stop(this.ctx.currentTime + 0.2);
              } catch(e){}
            }, idx * 120);
          });
        } 
        // 💥 МЕЛОДИЯ ПРОИГРЫША (Game Over)
        else if (type === 'lose') {
          const notes = [400, 350, 300, 220];
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              try {
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination);
                o.type = 'sawtooth'; o.frequency.value = freq;
                g.gain.setValueAtTime(0.2, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                o.start(); o.stop(this.ctx.currentTime + 0.3);
              } catch(e){}
            }, idx * 180);
          });
        }

        // Вибрация
        if (navigator.vibrate) {
          try {
            if (type === 'start') navigator.vibrate([30, 30, 30, 30, 60]);
            else if (type === 'miss') navigator.vibrate(25);
            else if (type === 'hit') navigator.vibrate([40, 30, 40]);
            else if (type === 'sunk') navigator.vibrate([100, 50, 100]);
            else if (type === 'win') navigator.vibrate([100, 50, 100, 50, 200]);
            else if (type === 'lose') navigator.vibrate([200, 100, 200]);
          } catch(e){}
        }
      }
    }
    const sound = new SoundEngine();

    let localGame = null;
    let destroyedShips = new Set();
    const ROW_LABELS = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З', 'И', 'К'];

    function initBoard() {
      const board = document.getElementById('gameBoard');
      board.innerHTML = '<div class="board-label"></div>';
      for (let c = 1; c <= 10; c++) board.innerHTML += `<div class="board-label">${c}</div>`;
      
      for (let r = 0; r < 10; r++) {
        board.innerHTML += `<div class="board-label">${ROW_LABELS[r]}</div>`;
        for (let c = 0; c < 10; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell unknown';
          cell.id = `cell-${r}-${c}`;
          cell.dataset.r = r;
          cell.dataset.c = c;
          board.appendChild(cell);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const board = document.getElementById('gameBoard');
      
      const handleTouch = (e) => {
        const target = e.target.closest('.cell');
        if (target && target.dataset.r !== undefined) {
          e.preventDefault();
          const r = parseInt(target.dataset.r);
          const c = parseInt(target.dataset.c);
          handleCellClick(r, c);
        }
      };

      board.addEventListener('touchstart', handleTouch, {passive: false});
      board.addEventListener('click', handleTouch);
    });

    function startNewGame() {
      const nameInput = document.getElementById('playerNameInput');
      const name = nameInput.value.trim();
      if (!name) { 
        alert("Введите имя капитана!"); 
        nameInput.focus();
        return; 
      }
      
      sound.init();
      sound.play('start'); // 🚀 Звук старта боя
      
      const grid = generateShips();
      
      localGame = { name, grid, score: 0, shots: 0, maxShots: 40, hitCells: new Set(), status: 'active' };
      
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      
      destroyedShips.clear();
      initBoard();
      updateFleetStatus();
      updateDisplay();
      setMessage(`Капитан ${name}, огонь по цели! 🎯`);
    }

    function generateShips() {
      const sizes = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
      let grid, success = false;

      while (!success) {
        grid = Array.from({length: 10}, () => Array(10).fill(0));
        success = true;

        for (let id = 0; id < sizes.length; id++) {
          const size = sizes[id];
          let placed = false, attempts = 0;

          while (!placed && attempts < 100) {
            attempts++;
            const h = Math.random() > 0.5;
            const r = Math.floor(Math.random() * 10);
            const c = Math.floor(Math.random() * 10);

            if (canPlace(grid, r, c, size, h)) {
              for (let i = 0; i < size; i++) {
                grid[h ? r : r + i][h ? c + i : c] = id + 1;
              }
              placed = true;
            }
          }

          if (!placed) {
            success = false;
            break;
          }
        }
      }
      return grid;
    }

    function canPlace(grid, r, c, s, h) {
      for (let i = 0; i < s; i++) {
        const currR = h ? r : r + i;
        const currC = h ? c + i : c;
        
        if (currR >= 10 || currC >= 10 || grid[currR][currC] !== 0) return false;
        
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = currR + dr, nc = c + dc;
            if (nr >= 0 && nr < 10 && nc >= 0 && nc < 10 && grid[nr][nc] !== 0) return false;
          }
        }
      }
      return true;
    }

    function handleCellClick(r, c) {
      if (!localGame || localGame.status !== 'active') return;
      const key = `${r}-${c}`;
      if (localGame.hitCells.has(key)) return;
      
      localGame.hitCells.add(key);
      const cell = document.getElementById(`cell-${r}-${c}`);
      if (!cell) return;
      
      const shipId = localGame.grid[r][c];

      if (shipId > 0) {
        let shipCells = [], allHit = true;
        for (let i = 0; i < 10; i++) {
          for (let j = 0; j < 10; j++) {
            if (localGame.grid[i][j] === shipId) {
              shipCells.push({i, j});
              if (!localGame.hitCells.has(`${i}-${j}`)) allHit = false;
            }
          }
        }

        if (allHit) {
          shipCells.forEach(s => { 
            const el = document.getElementById(`cell-${s.i}-${s.j}`);
            if (el) el.className = 'cell sunk'; 
          });
          localGame.score += shipCells.length * 20;
          destroyedShips.add(shipId);
          sound.play('sunk');
          setMessage("ПОТОПЛЕН! 💀");
          
          shipCells.forEach(s => {
            for (let di = -1; di <= 1; di++) {
              for (let dj = -1; dj <= 1; dj++) {
                const ni = s.i + di, nj = s.j + dj;
                if (ni >= 0 && ni < 10 && nj >= 0 && nj < 10 && localGame.grid[ni][nj] === 0 && !localGame.hitCells.has(`${ni}-${nj}`)) {
                  localGame.hitCells.add(`${ni}-${nj}`);
                  const missEl = document.getElementById(`cell-${ni}-${nj}`);
                  if (missEl) missEl.className = 'cell miss';
                }
              }
            }
          });
        } else {
          cell.className = 'cell hit'; 
          localGame.score += 10; 
          sound.play('hit'); 
          setMessage("ПОПАДАНИЕ! 🔥");
        }
      } else {
        cell.className = 'cell miss'; 
        localGame.shots++; 
        sound.play('miss'); 
        setMessage("МИМО... 💨");
      }

      if (destroyedShips.size === 10) { 
        localGame.status = 'won'; 
        setMessage("🎉 ПОБЕДА! Все корабли уничтожены!"); 
        sound.play('win');
        finishGame(); 
      } else if (localGame.shots >= localGame.maxShots) { 
        localGame.status = 'lost'; 
        setMessage("💥 ВЫСТРЕЛЫ ЗАКОНЧИЛИСЬ!"); 
        sound.play('lose');
        reveal(); 
        finishGame(); 
      }
      
      updateDisplay();
      updateFleetStatus();
    }

    function finishGame() {
      let scores =
